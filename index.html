<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riya Spa Udaipur</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script>let L=localStorage.getItem('riya_config'); if(L){try{window.OVERRIDE_CONFIG=JSON.parse(L);}catch(e){}}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0e0e0e}
.main{max-width:430px;margin:auto;background:#fff;min-height:100vh}
.top{background:#111;color:#fff;padding:24px;text-align:center}
.top h1{font-family:Playfair Display,serif;letter-spacing:5px;font-size:26px}
.top p{font-size:10px;letter-spacing:3px;color:#888;margin-top:5px}
.badge{background:#D9FF66;color:#111;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:800;margin-top:10px;display:inline-block}
.content{padding:18px}
.lbl{font-size:10px;font-weight:800;letter-spacing:2px;color:#999;margin:16px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid #eee;background:#fafafa;border-radius:14px;padding:14px;text-align:center;font-weight:700;cursor:pointer}
.opt.active{background:#111;color:#fff;border-color:#111}
.input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #eee;background:#f8f8f8;outline:none}
.priceBox{background:#111;color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;margin-top:16px}
.book{width:100%;background:#D9FF66;border:none;padding:16px;border-radius:14px;font-weight:800;margin-top:14px;cursor:pointer}
.pay{border:2px dashed #ddd;border-radius:18px;padding:16px;text-align:center;margin-top:16px}
.qr{width:190px;height:190px;border-radius:12px;margin:10px auto;display:none}
.tag{background:#111;color:#D9FF66;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block}
</style>
</head>
<body>
<div class="main">
<div class="top"><h1>RIYA SPA</h1><p>PREMIUM SERVICE - UDAIPUR</p><div class="badge">TRUSTED BY 5000+ CLIENTS</div></div>
<div class="content">
<div class="lbl">SELECT SERVICE</div>
<div class="grid2">
<div class="opt active" onclick="selS(this,'1 Hour')">1 Hour</div>
<div class="opt" onclick="selS(this,'2 Hour')">2 Hour</div>
<div class="opt" onclick="selS(this,'3 Hour')">3 Hour</div>
<div class="opt" onclick="selS(this,'Full Night')">Full Night</div>
</div>
<div class="lbl">PERSONS</div>
<div class="grid2">
<div class="opt active" onclick="selP(this,1)">1 Person</div>
<div class="opt" onclick="selP(this,2)">2 Person</div>
</div>
<div class="lbl">DETAILS</div>
<input id="name" class="input" placeholder="Your Name" style="margin-bottom:8px">
<input id="mob" class="input" placeholder="Mobile Number">
<div class="priceBox"><div><div style="font-size:10px;color:#aaa">TOTAL</div><h2 id="total">₹2000</h2><div id="brk" style="font-size:10px;color:#aaa">1 Hour x 1</div></div><div style="text-align:right"><div style="font-size:10px;color:#aaa">ADVANCE</div><h2 id="adv" style="color:#D9FF66">₹300</h2></div></div>
<button class="book" onclick="book()">BOOK NOW - PAY <span id="bamt">₹300</span></button>
<div id="payBox" style="display:none"><div class="pay">
<div style="font-weight:800;letter-spacing:1px">PAY ADVANCE</div>
<div id="payAmt" style="font-size:30px;font-weight:800;margin:8px 0">₹300</div>
<div id="payTag" class="tag">1 Person Advance</div>
<img id="qrImg" class="qr" src="">
<div style="font-size:13px;margin-top:8px">UPI: <b id="upi">loading</b></div>
<input type="file" id="ss" class="input" style="margin-top:10px">
<button class="book" style="background:#111;color:#fff" onclick="confirm()">I HAVE PAID</button>
</div></div>
<div id="done" style="display:none;background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center;margin-top:16px"><h3>Booking Confirmed</h3><a id="tg" href="#" target="_blank" style="display:block;background:#D9FF66;color:#111;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:12px">CONTACT ON TELEGRAM</a></div>
</div>
</div>
<script>
let S='1 Hour',P=1,CFG=null;
async function getC(){if(window.OVERRIDE_CONFIG)return window.OVERRIDE_CONFIG;let r=await fetch('config.json');return r.json();}
getC().then(c=>{CFG=c;document.getElementById('upi').innerText=c.upi;if(c.qr){let q=document.getElementById('qrImg');q.src=c.qr;q.style.display='block';}document.getElementById('tg').href='https://telegram.me/'+(c.telegram||'Sonal_0101');update();});
function selS(e,s){for(let x of e.parentElement.children)x.classList.remove('active');e.classList.add('active');S=s;update();}
function selP(e,n){for(let x of e.parentElement.children)x.classList.remove('active');e.classList.add('active');P=n;update();}
function update(){
if(!CFG)return;
let base=(CFG.prices&&CFG.prices[S])||2000;
let total=base*P;
let adv=(CFG.bookingAmount||300)*P; // AUTOMATIC DOUBLE LOGIC
document.getElementById('total').innerText='₹'+total;
document.getElementById('adv').innerText='₹'+adv;
document.getElementById('bamt').innerText='₹'+adv;
document.getElementById('payAmt').innerText='₹'+adv;
document.getElementById('brk').innerText=S+' x '+P+' Person';
document.getElementById('payTag').innerText= P==2? '2 Person = Double Advance ₹'+adv : '1 Person Advance ₹'+adv;
}
function book(){if(!name.value.trim()||!mob.value.trim()){alert('Name Mobile bharo');return;}update();payBox.style.display='block';window.scrollTo(0,9999);}
function confirm(){if(!ss.files[0]){alert('Screenshot dalo');return;}payBox.style.display='none';done.style.display='block';}
</script>
</body>
</html>
