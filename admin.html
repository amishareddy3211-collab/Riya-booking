<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riya Admin - Auto Update</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;padding:15px}
.box{background:#222;padding:15px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#333;color:#fff;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#25D366;color:#fff;font-weight:bold;font-size:16px;margin-top:10px}
h2{color:#25D366}
#loginBox{display:block} #mainBox{display:none}
</style>
</head>
<body>

<div id="loginBox" class="box">
<h2>🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Password dalo">
<button onclick="login()">Login</button>
</div>

<div id="mainBox">
<div class="box" style="border:2px solid #25D366">
<h2>🔑 GitHub Token - Auto Update</h2>
<p style="font-size:12px;color:#aaa">Ye ek baar dalne ke baad auto update ON ho jayega</p>
<input id="token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx paste karo">
<button onclick="saveToken()">💾 SAVE TOKEN - AUTO ON</button>
<p id="tokenStatus" style="font-size:13px"></p>
</div>

<div class="box">
<h2>⚙️ Website Settings</h2>
<input id="upi" placeholder="UPI ID - jaise riya@upi">
<input id="amount" placeholder="Amount - jaise 550">
<input id="name" placeholder="Name - jaise Riya">
<input id="photo" type="file" accept="image/*">
<button onclick="saveAll()">💾 SAVE & AUTO UPDATE WEBSITE</button>
<p id="status"></p>
</div>
</div>

<script>
const PASS="riya123";
const REPO="amishareddy3211-collab/Riya-booking";
function login(){
 if(document.getElementById('pass').value===PASS){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('mainBox').style.display='block';
  loadSaved();
 }else alert("Galat password");
}
function saveToken(){
 const t=document.getElementById('token').value.trim();
 if(!t.startsWith("ghp_")){alert("Sahi token dalo ghp_ se start hona chahiye");return;}
 localStorage.setItem("github_token",t);
 document.getElementById('tokenStatus').innerText="✅ Token Save Ho Gaya! Auto Update ON Hai!";
 alert("✅ Token Save! Ab neeche SAVE & AUTO UPDATE dabao to auto website update hogi");
}
function loadSaved(){
 const t=localStorage.getItem("github_token");
 if(t){document.getElementById('token').value=t; document.getElementById('tokenStatus').innerText="✅ Token pehle se ON hai";}
 const cfg=JSON.parse(localStorage.getItem("riya_config")||"{}");
 if(cfg.upi) document.getElementById('upi').value=cfg.upi;
 if(cfg.amount) document.getElementById('amount').value=cfg.amount;
}
async function saveAll(){
 const token=localStorage.getItem("github_token");
 if(!token){alert("Pehle upar Token wala box me token dalo aur SAVE TOKEN dabao!");return;}
 const upi=document.getElementById('upi').value;
 const amount=document.getElementById('amount').value;
 const name=document.getElementById('name').value;
 const cfg={upi,amount,name,updated:Date.now()};
 localStorage.setItem("riya_config",JSON.stringify(cfg));
 document.getElementById('status').innerText="⏳ Upload ho raha hai...";
 try{
  const getRes=await fetch(`https://api.github.com/repos/${REPO}/contents/config.json`,{headers:{Authorization:`token ${token}`}});
  const getData=await getRes.json();
  const sha=getData.sha;
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2))));
  const putRes=await fetch(`https://api.github.com/repos/${REPO}/contents/config.json`,{
   method:"PUT",
   headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},
   body:JSON.stringify({message:"Auto update from admin",content,sha})
  });
  if(putRes.ok){document.getElementById('status').innerText="✅ SUCCESS! 1-2 min me website auto update ho jayegi!"; alert("Ho gaya! Website update ho rahi hai");}
  else{const e=await putRes.text(); document.getElementById('status').innerText="❌ Error: "+e}
 }catch(err){document.getElementById('status').innerText="❌ Error: "+err.message}
}
</script>
</body>
</html>
